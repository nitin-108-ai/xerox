<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline • Smart Xerox</title>
  <meta name="theme-color" content="#0B192C" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F8FAFC;
      color: #0F172A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 24px;
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05);
    }
    .icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #EFF6FF;
      color: #2563EB;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }
    .icon svg {
      width: 28px;
      height: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0B192C;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: #D97706;
      background: #FEF3C7;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 14px;
    }
    button {
      background: #0B192C;
      color: #FFFFFF;
      border: none;
      padding: 12px 24px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    button:hover {
      background: #1E3A8A;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.828m2.829 2.828L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-2.828-6.364m0 0L3 3m2.464 5.464a5 5 0 011.414-2.828" />
      </svg>
    </div>
    <span class="badge">Connection Offline</span>
    <h1>Smart Xerox is Offline</h1>
    <p>You appear to be offline or experiencing connection interruptions. Once your device reconnects to Wi-Fi or mobile data, your print jobs and receiving panel will resume automatically.</p>
    <button onclick="window.location.reload()">Check Connection &amp; Retry</button>
  </div>
</body>
</html>
