<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart Xerox</title>
    <meta name="description" content="Smart Xerox — QR-to-Print System" />
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0B192C" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Smart Xerox" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Google Fonts: Inter, Outfit, Syne -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 min-h-screen text-slate-900">
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F8FAFC;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
        <div style="text-align:center;padding:24px;">
          <div style="width:44px;height:44px;border:3px solid #E2E8F0;border-top-color:#0B192C;border-radius:50%;margin:0 auto 16px;animation:sx-spin 0.8s linear infinite;"></div>
          <h2 style="font-size:16px;font-weight:700;color:#0B192C;margin:0 0 6px 0;letter-spacing:-0.01em;">Smart Xerox</h2>
          <p style="font-size:12px;color:#64748B;margin:0;">Initializing QR Print System...</p>
        </div>
      </div>
      <style>
        @keyframes sx-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>

  </body>
</html>
